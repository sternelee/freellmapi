name = "freellmapi"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Serve the React SPA alongside the Worker
[assets]
directory = "../client/dist"
html_handling = "auto-trailing-slash"
not_found_handling = "single-page-application"

# D1 SQLite database
[[d1_databases]]
binding = "DB"
database_name = "freellmapi"
database_id = "894308b8-32ab-40ef-b1f6-7c975684454a"
migrations_dir = "src/db/migrations"

# KV namespace for sticky sessions
[[kv_namespaces]]
binding = "SESSIONS"
id = "66613f82f8894980bf79f344efd3e3d8"

# Durable Object for rate-limit state
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_classes = ["RateLimiterDO"]

# Cron trigger: health check every 5 minutes
[triggers]
crons = ["*/5 * * * *"]

# Secrets — set via: wrangler secret put ENCRYPTION_KEY
# ENCRYPTION_KEY: 64-char hex string (32 bytes). Generate with (any method):
#   openssl rand -hex 32
#   python3 -c "import secrets; print(secrets.token_hex(32))"
